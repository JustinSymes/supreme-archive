<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saved Supreme Outfits | Supreme Archive</title>
<meta name="description" content="View, edit, and download outfits created with the Supreme Archive outfit builder.">
<meta name="robots" content="noindex, follow, max-image-preview:large">
<link rel="canonical" href="https://supremearchive.net/fits.html">
<link rel="icon" type="image/png" href="/favicon.png">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background:#fff;
}

.header{
  text-align:center;
  padding:16px;
  font-weight:700;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:#f8f8f8;
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  display:block;
}

.topbar{
  height:64px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 16px;
}

.back{
  justify-self:start;
  color:#e10600;
  font-weight:600;
  text-decoration:none;
  font-size:18px;
}

.title{
  justify-self:center;
  font-size:20px;
  font-weight:700;
}

.fit-item-link{
  position:absolute;
  border-radius:6px;
}

.fit-item-link:focus-visible{
  outline:2px solid #e10600;
  outline-offset:2px;
}
</style>
</head>

<body>

<div class="topbar">
  <a class="back" id="backText" href="fit.html">← Back</a>
  <div class="title" id="titleText">Your Fits</div>
  <div></div>
</div>

<div class="grid" id="grid"></div>

<script src="lang.js"></script>

<script>

function applyLanguage(){
  setText("backText", "back");
  setText("titleText", "yourFits");
}

applyLanguage();

function downloadImage(dataUrl){
  const link = document.createElement("a");
  link.href = dataUrl;
  link.download = "fit.png";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

let dragIndex = null;
let fits = JSON.parse(localStorage.getItem("savedFits") || "[]");
const grid = document.getElementById("grid");

function saveFits(){
  localStorage.setItem("savedFits", JSON.stringify(fits));
}

function photoKey(src){
  if(!src) return "";

  try{
    return decodeURIComponent(new URL(src, window.location.href).pathname).toLowerCase();
  }catch{
    return src.toLowerCase();
  }
}

function canLoadFitFromUserArchive(fit){
  if(localStorage.getItem("fitArchiveMode") !== "user") return true;

  const myItems = JSON.parse(localStorage.getItem("myItems") || "[]");
  const userPhotos = myItems.flatMap(item =>
    (item.src || item.image || "")
      .split("|")
      .map(photo => photoKey(photo.trim()))
      .filter(Boolean)
  );

  return [fit.top, fit.bottom, fit.hat, fit.acc, fit.shoe]
    .map(photoKey)
    .filter(Boolean)
    .every(photo => userPhotos.includes(photo));
}

function fitHasShoes(fit){
  const shoe = (fit.shoe || "").trim();
  if(!shoe) return false;

  return !photoKey(shoe).endsWith("/fit.html");
}

function renderFits(){
  grid.innerHTML = "";

  fits.forEach((fit, index) => {

    const card = document.createElement("div");
    card.className = "card";

    card.draggable = true;

    card.ondragstart = () => {
      dragIndex = index;
    };

    card.ondragover = (e) => {
      e.preventDefault();
    };

    card.ondrop = () => {
      if(dragIndex === null) return;

      const moved = fits.splice(dragIndex,1)[0];
      fits.splice(index,0,moved);

      saveFits();
      renderFits();
    };

    const img = document.createElement("img");
    img.src = fit.img;

    img.onclick = () => openViewer(index);

    const nameRow = document.createElement("div");
    nameRow.style.display = "flex";
    nameRow.style.alignItems = "center";
    nameRow.style.justifyContent = "space-between";
    nameRow.style.padding = "6px 8px";

    const name = document.createElement("div");
    name.textContent = fit.name || t("tapToName");
    name.style.fontSize = "14px";
    name.style.cursor = "pointer";

    name.onclick = () => {
      const newName = prompt(t("nameThisFit"), fit.name || "");
      if(newName !== null){
        fits[index].name = newName;
        saveFits();
        renderFits();
      }
    };

    const del = document.createElement("div");
    del.textContent = "🗑";
    del.style.cursor = "pointer";

    del.onclick = () => {
      fits.splice(index,1);
      saveFits();
      renderFits();
    };

    nameRow.appendChild(name);
    nameRow.appendChild(del);

    card.appendChild(img);
    card.appendChild(nameRow);

    grid.appendChild(card);
  });
}

renderFits();

const selectedFit = new URLSearchParams(window.location.search).get("fit");
if(selectedFit !== null && /^\d+$/.test(selectedFit) && fits[Number(selectedFit)]){
  openViewer(Number(selectedFit));
}

function openViewer(index){

  const viewerUrl = new URL(window.location.href);
  viewerUrl.searchParams.set("fit", index);
  history.replaceState(null, "", viewerUrl);

  const viewer = document.createElement("div");
  viewer.style.position = "fixed";
  viewer.style.top = "0";
  viewer.style.left = "0";
  viewer.style.width = "100%";
  viewer.style.height = "100%";
  viewer.style.background = "#fff";
  viewer.style.display = "flex";
  viewer.style.flexDirection = "column";
  viewer.style.zIndex = "999";

  const topbar = document.createElement("div");
  topbar.style.display = "flex";
  topbar.style.justifyContent = "space-between";
  topbar.style.alignItems = "center";
  topbar.style.padding = "16px";
  topbar.style.flex = "0 0 auto";

  const back = document.createElement("div");
  back.textContent = t("back");
  back.style.color = "#e10600";
  back.style.fontWeight = "600";
  back.style.cursor = "pointer";

  back.onclick = () => {
    document.body.removeChild(viewer);
    viewerUrl.searchParams.delete("fit");
    history.replaceState(null, "", viewerUrl);
  };

  const edit = document.createElement("div");
  edit.textContent = t("loadInBuilder");
  edit.style.color = "#e10600";
  edit.style.fontWeight = "700";
  edit.style.cursor = "pointer";

  edit.onclick = () => {
    if(localStorage.getItem("fitNoShoes") === "true" && fitHasShoes(fits[index])){
      alert("Turn off No shoes to load fit.");
      return;
    }

    if(!canLoadFitFromUserArchive(fits[index])){
      alert("Enable the Entire Archive to load fit.");
      return;
    }

    localStorage.setItem("editFit", JSON.stringify(fits[index]));
    window.location.href = "fit.html";
  };

  const save = document.createElement("div");
  save.textContent = t("save");
  save.style.color = "#e10600";
  save.style.fontWeight = "700";
  save.style.cursor = "pointer";

  save.onclick = () => downloadImage(fits[index].img);

  topbar.appendChild(back);
  topbar.appendChild(edit);
  topbar.appendChild(save);

  const img = document.createElement("img");
  img.src = fits[index].img;
  img.style.width = "auto";
  img.style.height = "auto";
  img.style.maxWidth = "100%";
  img.style.maxHeight = "100%";
  img.style.objectFit = "contain";
  img.style.display = "block";
  img.style.margin = "auto";

  const imageArea = document.createElement("div");
  imageArea.style.flex = "1 1 auto";
  imageArea.style.minHeight = "0";
  imageArea.style.overflow = "auto";
  imageArea.style.display = "flex";
  imageArea.style.alignItems = "center";
  imageArea.style.justifyContent = "center";
  const preview = document.createElement("div");
  preview.style.position = "relative";
  preview.style.flexShrink = "0";
  img.style.width = "100%";
  img.style.height = "100%";
  preview.appendChild(img);
  imageArea.appendChild(preview);

  // Older saves have only the exported image and slot photos (1080 x 1920 layout).
  const fallbackBounds = {
    hat: {x:.1, y:120/1920, width:.4, height:250/1920},
    acc: {x:.5, y:120/1920, width:.4, height:250/1920},
    top: {x:.1, y:385/1920, width:.8, height:700/1920},
    bottom: {x:.1, y:1100/1920, width:.8, height:700/1920},
    shoe: {x:.62, y:1550/1920, width:.35, height:250/1920}
  };
  const labels = {hat:"hats", acc:"accessories", top:"tops", bottom:"bottoms", shoe:"shoes"};
  for(const slot of Object.keys(fallbackBounds)){
    const photo = fits[index][slot];
    if(!photo || photoKey(photo).endsWith("/fit.html")) continue;
    const bounds = fits[index].itemBounds?.[slot] || fallbackBounds[slot];
    const link = document.createElement("a");
    link.className = "fit-item-link";
    link.href = "item.html?" + new URLSearchParams({photo, fit:index});
    link.setAttribute("aria-label", t(labels[slot]));
    link.style.left = `${bounds.x * 100}%`;
    link.style.top = `${bounds.y * 100}%`;
    link.style.width = `${bounds.width * 100}%`;
    link.style.height = `${bounds.height * 100}%`;
    preview.appendChild(link);
  }

  function sizePreview(){
    if(!img.naturalWidth || !img.naturalHeight) return;
    const scale = Math.min(imageArea.clientWidth / img.naturalWidth,
      imageArea.clientHeight / img.naturalHeight);
    preview.style.width = `${img.naturalWidth * scale}px`;
    preview.style.height = `${img.naturalHeight * scale}px`;
  }
  img.onload = sizePreview;
  const resizeObserver = new ResizeObserver(sizePreview);
  resizeObserver.observe(imageArea);
  back.addEventListener("click", () => resizeObserver.disconnect());

  viewer.appendChild(topbar);
  viewer.appendChild(imageArea);

  document.body.appendChild(viewer);
  sizePreview();
}

</script>

</body>
</html>
