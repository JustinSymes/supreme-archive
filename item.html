<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supreme Item Details | Supreme Archive</title>
<meta id="metaDescription" name="description" content="View Supreme item images, category, size, and original retail price in Supreme Archive.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link id="canonicalUrl" rel="canonical" href="https://supremearchive.net/item.html">
<link rel="icon" type="image/png" href="/favicon.png">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body {
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  padding:20px;
}

img {
  width:100%;
  max-width:400px;
}

.back {
  color:#e10600;
  cursor:pointer;
  margin-bottom:15px;
  display:inline-block;
}

.carousel {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 520px;
  margin: 18px auto 10px;
}

.track {
  display: flex;
  transition: transform 220ms ease;
}

.slide {
  min-width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 10px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: #ddd;
}

.dot.active {
  background: #e10600;
}

.meta-row{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-top:14px;
  margin-bottom:6px;
}

.meta-left,
.meta-right{
  font-size:18px;
}

.label{
  color:#666;
  margin-right:6px;
}

.price-value{
  font-weight:800;
}

.price-toggle{
  color:#e10600;
  font-weight:700;
  cursor:pointer;
  margin-left:6px;
  user-select:none;
}
</style>
</head>

<body>

<div class="back" id="backText" onclick="history.back()">← Back to Archive</div>

<div id="content"></div>

<script src="lang.js"></script>

<script>

setText("backText", "backArchive");

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const name = params.get("name");

fetch("https://docs.google.com/spreadsheets/d/1AP4KwfrGxdReQIcCQHcTtoMfMyYs_6Rd5xbCwAHh15w/export?format=csv&gid=0")
.then(res=>res.text())
.then(data=>{

  const parsed = Papa.parse(data, { skipEmptyLines: true }).data;
  const rows = parsed.slice(1);

  let foundRow = null;

  const myItems = JSON.parse(localStorage.getItem("myItems") || "[]");
  const oldItem = myItems.find(i => i.id === id);

  rows.forEach(cols => {

  if(id && cols[0] === id){
    foundRow = cols;
  }

  if(!foundRow && name && cols[1] &&
     cols[1].toLowerCase() === name.toLowerCase()){
    foundRow = cols;
  }

  if(!foundRow && oldItem && cols[1] &&
     cols[1].toLowerCase() === oldItem.name.toLowerCase()){
    foundRow = cols;
  }

});

  if(!foundRow){
    document.getElementById("content").innerHTML = "Item not found";
    return;
  }

  const cols = foundRow;
  document.title = `${cols[1]} | Supreme Archive`;
  document.getElementById("metaDescription").content =
    `View images, category, size, and original retail price for ${cols[1]} in Supreme Archive.`;
  const canonicalUrl = new URL("https://supremearchive.net/item.html");
  if(id) canonicalUrl.searchParams.set("id", id);
  else if(name) canonicalUrl.searchParams.set("name", name);
  document.getElementById("canonicalUrl").href = canonicalUrl.toString();

  const images = (cols[8] || "")
    .split("|")
    .map(s => s.trim())
    .filter(Boolean);

  const priceCad = cols[10];
  const priceUsd = cols[11];
  const currencies = ["CAD", "USD", "EUR", "GBP", "JPY"];

  let displaySize = "";

const owned = myItems.find(i =>
  (id && (i.id === id || i.sheetId === id)) ||
  (name && i.name && i.name.toLowerCase() === name.toLowerCase())
);

if(owned && owned.size){
  displaySize = owned.size;
}
else if(cols[3]){
  displaySize = cols[3];
}

if(owned && owned.size){
  displaySize = owned.size;
}
else if(cols[3]){
  displaySize = cols[3];
}

  document.getElementById("content").innerHTML = `
    <h2>${cols[1]}</h2>

    <div class="carousel">
      <div class="track" id="track"></div>
    </div>
    <div class="dots" id="dots"></div>

    <div class="meta-row">
      <div class="meta-left">
        <span class="label">${t("category")}:</span> ${cols[2] || ""}
      </div>

      <div class="meta-right">
        <span class="label">${t("retail")}:</span>
        <span class="price-value" id="priceValue"></span>
        <span class="price-toggle" id="priceToggle">CAD</span>
      </div>
    </div>

    <p>${t("size")}: ${displaySize}</p>
  `;

  buildCarousel(images);

  let currency = getCurrency();
  if(!currencies.includes(currency)) currency = "CAD";
  let exchangeRates = null;

  function parseMoney(value){
    const num = Number(String(value || "").replace(/[^0-9.]/g,""));
    return Number.isFinite(num) && num > 0 ? num : null;
  }

  function formatMoney(value, code){
    return new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: code,
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(value);
  }

  async function loadExchangeRates(){
    const cacheKey = "usdExchangeRates";

    try{
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
      if(cached && Date.now() - cached.savedAt < 86400000){
        exchangeRates = cached.rates;
        return;
      }
    }catch{}

    try{
      const response = await fetch(
        "https://api.frankfurter.dev/v1/latest?base=USD&symbols=CAD,EUR,GBP,JPY"
      );
      if(!response.ok) throw new Error("Exchange-rate request failed");
      const data = await response.json();
      exchangeRates = { USD: 1, ...data.rates };
      localStorage.setItem(cacheKey, JSON.stringify({
        savedAt: Date.now(),
        rates: exchangeRates
      }));
    }catch{
      exchangeRates = null;
    }
  }

  function renderPrice(){
    const pv = document.getElementById("priceValue");
    const pt = document.getElementById("priceToggle");

    if (!pv || !pt) return;

    if (!priceCad && !priceUsd){
      pv.textContent = "";
      pt.style.display = "none";
      return;
    }

    const cad = parseMoney(priceCad);
    const usd = parseMoney(priceUsd);
    let value = currency === "CAD" ? cad : currency === "USD" ? usd : null;

    if(value === null && exchangeRates){
      const usdValue = usd || (cad && exchangeRates.CAD
        ? cad / exchangeRates.CAD
        : null);
      if(usdValue && exchangeRates[currency]){
        value = Math.round(usdValue * exchangeRates[currency]);
      }
    }

    pv.textContent = value === null ? "—" : formatMoney(value, currency);
    pt.textContent = currency;
  }

  renderPrice();
  loadExchangeRates().then(renderPrice);

  document.getElementById("priceToggle")?.addEventListener("click", () => {
    currency = currencies[(currencies.indexOf(currency) + 1) % currencies.length];
    localStorage.setItem("currency", currency);
    renderPrice();
  });

});

function buildCarousel(images){
  const track = document.getElementById("track");
  const dots = document.getElementById("dots");

  if (!track || !dots) return;

  track.innerHTML = "";
  dots.innerHTML = "";

  if (images.length <= 1) {
    dots.style.display = "none";
  }

  images.forEach((src, i) => {
    if(!src) return;

    const slide = document.createElement("div");
    slide.className = "slide";
    slide.innerHTML = `<img src="${src}">`;
    track.appendChild(slide);

    if (images.length > 1) {
      const dot = document.createElement("div");
      dot.className = "dot" + (i === 0 ? " active" : "");
      dots.appendChild(dot);
    }
  });

  let index = 0;

  const setIndex = (i) => {
    index = Math.max(0, Math.min(images.length - 1, i));
    track.style.transform = `translateX(${-index * 100}%)`;

    [...dots.children].forEach((d, di) =>
      d.classList.toggle("active", di === index)
    );
  };

  let startX = 0;
  let startY = 0;
  let isHorizontal = false;

  const container = track.parentElement;
  const desktopPointer = window.matchMedia("(hover: hover) and (pointer: fine)");
  let carouselHovered = false;
  let lastWheelChange = 0;
  const changeDesktopPhoto = direction => {
    setIndex((index + direction + images.length) % images.length);
  };

  container.addEventListener("mouseenter", () => {
    if(desktopPointer.matches) carouselHovered = true;
  });

  container.addEventListener("mouseleave", () => {
    carouselHovered = false;
  });

  container.addEventListener("wheel", e => {
    if(!desktopPointer.matches || images.length <= 1) return;
    e.preventDefault();

    const now = Date.now();
    if(now-lastWheelChange < 180) return;
    lastWheelChange = now;
    changeDesktopPhoto(e.deltaY >= 0 ? 1 : -1);
  }, {passive:false});

  window.addEventListener("keydown", e => {
    if(!desktopPointer.matches || !carouselHovered || images.length <= 1) return;

    if(e.key === "ArrowRight" || e.key === "ArrowDown"){
      e.preventDefault();
      changeDesktopPhoto(1);
    } else if(e.key === "ArrowLeft" || e.key === "ArrowUp"){
      e.preventDefault();
      changeDesktopPhoto(-1);
    }
  });

  container.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isHorizontal = false;
  }, {passive:true});

  container.addEventListener("touchmove", e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;

    if(Math.abs(dx) > Math.abs(dy)){
      isHorizontal = true;
      e.preventDefault();
    }
  }, {passive:false});

  container.addEventListener("touchend", e => {
    if(!isHorizontal) return;

    const endX = e.changedTouches[0].clientX;

    if (endX < startX - 50) setIndex(index + 1);
    if (endX > startX + 50) setIndex(index - 1);
  });
}

</script>

</html>
