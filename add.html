<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add to Your Collection | Supreme Archive</title>
<meta name="description" content="Search Supreme clothing, hats, bags, accessories, shoes, and skate decks and add pieces to your personal Supreme collection tracker.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://supremearchive.net/add.html">
<link rel="icon" type="image/png" href="/favicon.png">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  padding:20px;
}

.topbar{
  height:64px;
  position:relative;
}

.back{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#e10600;
  font-weight:600;
  cursor:pointer;
}

.title{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-weight:700;
  font-size:18px;
  white-space:nowrap;
}

.request-link{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  color:#e10600;
  font-weight:700;
  text-decoration:none;
  white-space:nowrap;
  z-index:999;
}

.form{
  display:flex;
  flex-direction:column;
  gap:18px;
  margin-top:20px;
}

input, select{
  display:block;
  flex:0 0 auto;
  width:100%;
  min-height:50px;
  box-sizing:border-box;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  width:100%;
  margin-top:10px;
  padding:14px;
  background:#e10600;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
}

.keep-adding{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:-4px;
  color:#666;
  font-size:14px;
}

.keep-adding input{
  width:auto;
  min-height:0;
  margin:0;
  padding:0;
}

.result{
  margin-top:20px;
  text-align:left;
}

.result-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.result-item img{
  width:50px;
  height:50px;
  object-fit:contain;
}

.result-item.selected{
  background:#f5f5f5;
}

#addConfirmation{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.3);
  opacity:0;
  visibility:hidden;
  transition:opacity .15s ease, visibility .15s ease;
}

#addConfirmation.show{
  opacity:1;
  visibility:visible;
}

.add-confirmation-box{
  width:min(320px, 100%);
  padding:22px;
  border-radius:14px;
  background:#fff;
  text-align:center;
  box-shadow:0 12px 36px rgba(0,0,0,.24);
}

.add-confirmation-message{
  margin:0 0 18px;
  font-size:17px;
  font-weight:700;
}

.add-confirmation-box button{
  margin:0;
}

.mobile-confirm-label{ display:none; }

@media (max-width:600px){
  .desktop-confirm-label{ display:none; }
  .mobile-confirm-label{ display:inline; }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="back" id="backText" onclick="history.back()">← Back</div>
  <div class="title" id="titleText">Add Item</div>
  <a class="request-link" id="requestLinkText" href="request.html">Request</a>
</div>

<div class="form">

<input id="search" placeholder="Search item name...">

<select id="size">
  <option value="" id="selectSizeText">Select size</option>
</select>

<button id="addBtn">Add Item</button>

<label class="keep-adding">
  <input type="checkbox" id="keepAdding">
  <span>Keep page open to add more</span>
</label>

</div>

<div class="result" id="result"></div>
<div id="addConfirmation" role="alertdialog" aria-modal="true" aria-labelledby="addConfirmationMessage">
  <div class="add-confirmation-box">
    <p class="add-confirmation-message" id="addConfirmationMessage">Added ✓</p>
    <button type="button" id="addConfirmationClose">
      <span class="desktop-confirm-label">OK</span>
      <span class="mobile-confirm-label">Close</span>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="lang.js"></script>

<script>
const sheetURL =
"https://docs.google.com/spreadsheets/d/1AP4KwfrGxdReQIcCQHcTtoMfMyYs_6Rd5xbCwAHh15w/export?format=csv&gid=0";

let items = [];
let selectedItem = null;

function clean(v){
  return (v ?? "").toString().trim().replace(/^"+|"+$/g,"");
}

function applyLanguage(){
  setText("backText", "back");
  setText("titleText", "addItem");
  setPlaceholder("search", "searchItem");
  setText("selectSizeText", "selectSize");
  setText("addBtn", "addItemBtn");
  setText("requestLinkText", "request");
}

applyLanguage();

function showLoaded(){
  document.getElementById("result").innerHTML = "";
}

let addConfirmationTimer;
let addConfirmationCallback = null;

function closeAddConfirmation(){
  clearTimeout(addConfirmationTimer);
  document.getElementById("addConfirmation").classList.remove("show");
  const callback = addConfirmationCallback;
  addConfirmationCallback = null;
  if(callback) callback();
}

function showAddConfirmation(callback){
  clearTimeout(addConfirmationTimer);
  addConfirmationCallback = callback || null;
  document.getElementById("addConfirmation").classList.add("show");
  document.getElementById("addConfirmationClose").focus();
  addConfirmationTimer = setTimeout(closeAddConfirmation, 2000);
}

document.getElementById("addConfirmationClose").onclick = closeAddConfirmation;


// 📦 LOAD DATA
fetch(sheetURL)
.then(res => res.text())
.then(csv => {

  const rows = Papa.parse(csv, {
    skipEmptyLines:true
  }).data;

  items = rows.slice(1).map((c, index) => {

    const sheetId = clean(c[0]);
    const name = clean(c[1]);
    const category = clean(c[2]);
    const image = clean(c[8]);

    return {
      // ✅ If sheet ID is blank, use name instead of fake sheet-row ID
      id: sheetId || name,
      sheetId: sheetId,
      name,
      category,
      image
    };

  })
  .filter(i => i.name);

  showLoaded();

})
.catch(err => {
  console.error("ADD LOAD ERROR:", err);
  document.getElementById("result").innerHTML = "Error loading items";
});


// 🔥 SIZE LOGIC
function setSizeOptions(item){

  const sizeSelect = document.getElementById("size");

  let sizes = [];
  const name = (item.name || "").toLowerCase();
  const deckSizes = {
    "box logo skateboards (set of 12)": ['8.25" x 32"'],
    "supreme box logo tee skateboard": ['8.5" x 32"'],
    "money logo skateboard": ['8.25" x 32"'],
    "michael jackson® dangerous skateboard": ['8.25" x 32"'],
    "alice skateboard": ['8.375" x 32.125"'],
    "evolution skateboard": ['8.25" x 32"'],
    "prayer card skateboard": ['8.25" x 32"'],
    "black sith skateboard": ['8.25" x 32"'],
    "silver sith skateboard": ['8.375" x 32.125"'],
    "black action skateboard": ['8.25" x 32"'],
    "pink action skateboard": ['8.5" x 32.25"'],
    "blue action skateboard": ['8.375" x 32.125"']
  };

  if(deckSizes[name]){
    sizes = deckSizes[name];
  }
  else if(name.includes("jean")){
    sizes = ["30", "32", "34", "36", "38"];
  }
  else if(item.category === "Tops"){
  sizes = ["S", "M", "L", "XL", "XXL"];
}
else if(item.category === "Bottoms"){
  sizes = ["S", "M", "L", "XL", "XXL"];
}
  else if(item.category === "Hats"){
    sizes = ["S/M", "M/L", "One Size"];
  }
  else if(item.category === "Shoes"){
    sizes = ["6", "7", "8", "9", "10", "11", "12", "13"];
  }
  else{
    sizes = ["One Size"];
  }

  sizeSelect.innerHTML =
    `<option value="">${t("selectSize")}</option>` +
    sizes.map(s =>
      `<option value="${s}"${sizes.length === 1 ? " selected" : ""}>${s}</option>`
    ).join("");

}


// 🔍 SEARCH
document.getElementById("search").addEventListener("input", e=>{

  const val = e.target.value.toLowerCase();

  const container = document.getElementById("result");

  container.innerHTML = "";

  selectedItem = null;

  if(!val){
    showLoaded();
    return;
  }

  const results = items.filter(i =>
    (i.name || "").toLowerCase().includes(val)
  );

  if(results.length === 0){
    container.innerHTML =
      `<div style="color:#999;font-size:14px;">No results</div>`;
    return;
  }

  results.forEach(item => {

    const img =
      item.image
      ? item.image.split("|")[0].trim()
      : "";

    const div = document.createElement("div");

    div.className = "result-item";

    div.innerHTML = `
      ${img ? `<img src="${img}">` : ""}
      <div>${item.name}</div>
    `;

    div.onclick = () => {

  document.querySelectorAll(".result-item")
  .forEach(el =>
    el.classList.remove("selected")
  );

  div.classList.add("selected");

  selectedItem = item;

  setSizeOptions(item);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};

    container.appendChild(div);

  });

});


// ➕ ADD ITEM
document.getElementById("addBtn").onclick = () => {

  if(!selectedItem){
    return alert("Select item");
  }

  const size =
    document.getElementById("size").value;

  if(!size){
    return alert(t("selectSize"));
  }

  let myItems =
    JSON.parse(localStorage.getItem("myItems") || "[]");

  myItems.push({
    id: "user-" + Date.now(),

    // ✅ Keep sheetId blank if sheet ID is blank
    sheetId: selectedItem.sheetId || "",

    // ✅ Save name so item.html can find it by name
    name: selectedItem.name,

    category: selectedItem.category,
    size,
    src: selectedItem.image || ""
  });

  localStorage.setItem(
    "myItems",
    JSON.stringify(myItems)
  );

  if(document.getElementById("keepAdding").checked){
    selectedItem = null;
    document.getElementById("size").innerHTML =
      `<option value="">${t("selectSize")}</option>`;
    document.querySelectorAll(".result-item")
      .forEach(el => el.classList.remove("selected"));
    document.getElementById("search").focus();
    showAddConfirmation();
    return;
  }

  document.getElementById("addBtn").disabled = true;
  showAddConfirmation(() => {
    window.location.href = "index.html";
  });

};

</script>

<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"454d1d7a380d47d8a1a77c2b5b1d3dd6"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
