<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add to Your Collection | Supreme Archive</title>
<meta name="description" content="Search Supreme clothing, hats, bags, accessories, shoes, and skate decks and add pieces to your personal Supreme collection tracker.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://supremearchive.net/add.html">
<link rel="icon" type="image/png" href="/favicon.png">

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  padding:20px;
}

.topbar{
  height:64px;
  position:relative;
}

.back{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:#e10600;
  font-weight:600;
  cursor:pointer;
}

.title{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-weight:700;
  font-size:18px;
  white-space:nowrap;
}

.top-actions{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:24px;
  z-index:999;
}
.request-link{
  color:#e10600;
  font-weight:700;
  text-decoration:none;
  white-space:nowrap;
}
.camera-button{width:34px;height:34px;margin:0;padding:3px;background:transparent;color:#e10600;cursor:pointer}
.camera-button svg{display:block;width:100%;height:100%;fill:currentColor}
.photo-panel{margin-top:18px;padding:16px;border:1px solid #ddd;border-radius:12px}
.photo-panel[hidden],.photo-input[hidden],.photo-actions[hidden]{display:none}
.photo-preview{display:block;max-width:180px;max-height:180px;object-fit:contain;margin:0 auto 12px}
.photo-actions{display:flex;gap:10px}
.photo-actions a,.photo-actions button{flex:1;text-align:center;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;font-weight:700;text-decoration:none}
.photo-actions a{background:#e10600;color:#fff}
.photo-actions .secondary{background:#eee;color:#222}
.photo-status{margin:10px 0;color:#444}
.photo-match{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;padding:8px;border:1px solid #eee;background:#fff;color:#111;text-align:left;cursor:pointer}
.photo-match img{width:48px;height:48px;object-fit:contain}
@media(max-width:600px){.top-actions{gap:30px}.camera-button{width:32px;height:32px}.request-link{font-size:14px}}

.form{
  display:flex;
  flex-direction:column;
  gap:18px;
  margin-top:20px;
}

input, select{
  display:block;
  flex:0 0 auto;
  width:100%;
  min-height:50px;
  box-sizing:border-box;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  width:100%;
  margin-top:10px;
  padding:14px;
  background:#e10600;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
}

#cameraButton{width:34px;height:34px;min-width:34px;margin:0;padding:3px;background:transparent;color:#e10600;border:0}
@media(max-width:600px){#cameraButton{width:32px;height:32px;min-width:32px}}

.keep-adding{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:-4px;
  color:#666;
  font-size:14px;
}

.keep-adding input{
  width:auto;
  min-height:0;
  margin:0;
  padding:0;
}

.result{
  margin-top:20px;
  text-align:left;
}

.result-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.result-item img{
  width:50px;
  height:50px;
  object-fit:contain;
}

.result-item.selected{
  background:#f5f5f5;
}

#addToast{
  position:fixed;
  left:50%;
  bottom:32px;
  z-index:1000;
  padding:11px 18px;
  border-radius:999px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%, 16px);
  transition:opacity .2s ease, transform .2s ease;
}

#addToast.show{
  opacity:1;
  transform:translate(-50%, 0);
}
</style>
</head>

<body>

<div class="topbar">
  <div class="back" id="backText" onclick="history.back()">← Back</div>
  <div class="title" id="titleText">Add Item</div>
  <div class="top-actions"><button type="button" class="camera-button" id="cameraButton" aria-label="Find item by photo" title="Find item by photo"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M94 90h29q11 0 14 17h18l25-42q8-14 26-14h137q18 0 26 14l25 42h28q89 0 89 86v179q0 91-94 91H95Q1 463 1 372V193q0-69 39-84 2-19 23-19h31zm-15 30a29 29 0 1 0 0 58 29 29 0 0 0 0-58zm197 9a138 138 0 1 0 0 276 138 138 0 0 0 0-276zm0 44a94 94 0 1 1 0 188 94 94 0 0 1 0-188z" fill-rule="evenodd"/></svg></button><a class="request-link" id="requestLinkText" href="request.html">Request</a></div>
</div>

<div class="form">

<input id="search" placeholder="Search item name...">

<select id="size">
  <option value="" id="selectSizeText">Select size</option>
</select>

<button id="addBtn">Add Item</button>

<label class="keep-adding">
  <input type="checkbox" id="keepAdding">
  <span>Keep page open to add more</span>
</label>

</div>

<div class="result" id="result"></div>
<input class="photo-input" id="photoInput" type="file" accept="image/*" hidden>
<section class="photo-panel" id="photoPanel" hidden aria-live="polite"><img class="photo-preview" id="photoPreview" alt="Your selected photo"><div class="photo-status" id="photoStatus"></div><div id="photoMatches"></div><div class="photo-actions" id="photoActions" hidden><a href="request.html">Request Item</a><button type="button" class="secondary" id="photoBack">Back</button></div></section>
<div id="addToast" role="status" aria-live="polite">Added ✓</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="lang.js"></script>

<script>
const sheetURL =
"https://docs.google.com/spreadsheets/d/1AP4KwfrGxdReQIcCQHcTtoMfMyYs_6Rd5xbCwAHh15w/export?format=csv&gid=0";

let items = [];
let selectedItem = null;

function clean(v){
  return (v ?? "").toString().trim().replace(/^"+|"+$/g,"");
}

function applyLanguage(){
  setText("backText", "back");
  setText("titleText", "addItem");
  setPlaceholder("search", "searchItem");
  setText("selectSizeText", "selectSize");
  setText("addBtn", "addItemBtn");
  setText("requestLinkText", "request");
}

applyLanguage();

function showLoaded(){
  document.getElementById("result").innerHTML = "";
}

let addToastTimer;
function showAddToast(){
  const toast = document.getElementById("addToast");
  clearTimeout(addToastTimer);
  toast.classList.add("show");
  addToastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
}


// 📦 LOAD DATA
fetch(sheetURL)
.then(res => res.text())
.then(csv => {

  const rows = Papa.parse(csv, {
    skipEmptyLines:true
  }).data;

  items = rows.slice(1).map((c, index) => {

    const sheetId = clean(c[0]);
    const name = clean(c[1]);
    const category = clean(c[2]);
    const image = clean(c[8]);

    return {
      // ✅ If sheet ID is blank, use name instead of fake sheet-row ID
      id: sheetId || name,
      sheetId: sheetId,
      name,
      category,
      image
    };

  })
  .filter(i => i.name);

  showLoaded();

})
.catch(err => {
  console.error("ADD LOAD ERROR:", err);
  document.getElementById("result").innerHTML = "Error loading items";
});


// 🔥 SIZE LOGIC
function setSizeOptions(item){

  const sizeSelect = document.getElementById("size");

  let sizes = [];
  const name = (item.name || "").toLowerCase();
  const deckSizes = {
    "box logo skateboards (set of 12)": ['8.25" x 32"'],
    "supreme box logo tee skateboard": ['8.5" x 32"'],
    "money logo skateboard": ['8.25" x 32"'],
    "michael jackson® dangerous skateboard": ['8.25" x 32"'],
    "alice skateboard": ['8.375" x 32.125"'],
    "evolution skateboard": ['8.25" x 32"'],
    "prayer card skateboard": ['8.25" x 32"'],
    "black sith skateboard": ['8.25" x 32"'],
    "silver sith skateboard": ['8.375" x 32.125"'],
    "black action skateboard": ['8.25" x 32"'],
    "pink action skateboard": ['8.5" x 32.25"'],
    "blue action skateboard": ['8.375" x 32.125"']
  };

  if(deckSizes[name]){
    sizes = deckSizes[name];
  }
  else if(name.includes("jean")){
    sizes = ["30", "32", "34", "36", "38"];
  }
  else if(item.category === "Tops"){
  sizes = ["S", "M", "L", "XL", "XXL"];
}
else if(item.category === "Bottoms"){
  sizes = ["S", "M", "L", "XL", "XXL"];
}
  else if(item.category === "Hats"){
    sizes = ["S/M", "M/L", "One Size"];
  }
  else if(item.category === "Shoes"){
    sizes = ["6", "7", "8", "9", "10", "11", "12", "13"];
  }
  else{
    sizes = ["One Size"];
  }

  sizeSelect.innerHTML =
    `<option value="">${t("selectSize")}</option>` +
    sizes.map(s =>
      `<option value="${s}"${sizes.length === 1 ? " selected" : ""}>${s}</option>`
    ).join("");

}


// 🔍 SEARCH
document.getElementById("search").addEventListener("input", e=>{

  const val = e.target.value.toLowerCase();

  const container = document.getElementById("result");

  container.innerHTML = "";

  selectedItem = null;

  if(!val){
    showLoaded();
    return;
  }

  const results = items.filter(i =>
    (i.name || "").toLowerCase().includes(val)
  );

  if(results.length === 0){
    container.innerHTML =
      `<div style="color:#999;font-size:14px;">No results</div>`;
    return;
  }

  results.forEach(item => {

    const img =
      item.image
      ? item.image.split("|")[0].trim()
      : "";

    const div = document.createElement("div");

    div.className = "result-item";

    div.innerHTML = `
      ${img ? `<img src="${img}">` : ""}
      <div>${item.name}</div>
    `;

    div.onclick = () => {

  document.querySelectorAll(".result-item")
  .forEach(el =>
    el.classList.remove("selected")
  );

  div.classList.add("selected");

  selectedItem = item;

  setSizeOptions(item);

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};

    container.appendChild(div);

  });

});


// ➕ ADD ITEM
document.getElementById("addBtn").onclick = () => {

  if(!selectedItem){
    return alert("Select item");
  }

  const size =
    document.getElementById("size").value;

  if(!size){
    return alert(t("selectSize"));
  }

  let myItems =
    JSON.parse(localStorage.getItem("myItems") || "[]");

  myItems.push({
    id: "user-" + Date.now(),

    // ✅ Keep sheetId blank if sheet ID is blank
    sheetId: selectedItem.sheetId || "",

    // ✅ Save name so item.html can find it by name
    name: selectedItem.name,

    category: selectedItem.category,
    size,
    src: selectedItem.image || ""
  });

  localStorage.setItem(
    "myItems",
    JSON.stringify(myItems)
  );

  showAddToast();

  if(document.getElementById("keepAdding").checked){
    selectedItem = null;
    document.getElementById("size").innerHTML =
      `<option value="">${t("selectSize")}</option>`;
    document.querySelectorAll(".result-item")
      .forEach(el => el.classList.remove("selected"));
    const searchInput = document.getElementById("search");
    const mobileInput = window.matchMedia("(max-width: 600px), (hover: none) and (pointer: coarse)").matches;
    if(mobileInput){
      searchInput.blur();
    }else{
      searchInput.focus();
    }
    return;
  }

  document.getElementById("addBtn").disabled = true;
  setTimeout(() => {
    window.location.href = "index.html";
  }, 2000);

};

</script>

<script src="photo-color.js?v=20261106-fabric"></script>
<script src="photo-search.js?v=20261106-neutral"></script>

</body>
</html>
